name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches:
      - master
      - dev
      - uat
  push:
    branches:
      - master
      - dev
      - uat

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  #############################################
  # ✅ PR VALIDATION JOB
  #############################################
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      #####################################
      # ✅ TEST SELECTION FROM PR
      #####################################
      - name: Read Apex Tests From PR Description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt
          TESTS=$(sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p' pr_body.txt)

          if [ -z "$TESTS" ]; then
            echo "✅ No tests mentioned → Running ALL local tests"
            echo "APEX_TEST_LEVEL=RunLocalTests" >> $GITHUB_ENV
            echo "APEX_TESTS=" >> $GITHUB_ENV
          else
            CLEAN_TESTS=$(echo "$TESTS" | tr ',' ' ')
            echo "✅ Tests from PR: $CLEAN_TESTS"
            echo "APEX_TEST_LEVEL=RunSpecifiedTests" >> $GITHUB_ENV
            echo "APEX_TESTS=$CLEAN_TESTS" >> $GITHUB_ENV
          fi

      #####################################
      # ✅ INSTALL CLI + DELTA
      #####################################
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      #####################################
      # ✅ TARGET SELECTION (FINAL FIX)
      #####################################
      - name: Select Validation Target
        id: target
        run: |
          echo "PR Base Branch = ${{ github.base_ref }}"

          if [[ "${{ github.base_ref }}" == "dev" ]]; then
            echo "ORG=QA" >> $GITHUB_OUTPUT

          elif [[ "${{ github.base_ref }}" == "uat" ]]; then
            echo "ORG=UAT" >> $GITHUB_OUTPUT

          elif [[ "${{ github.base_ref }}" == "master" ]]; then
            echo "ORG=PROD" >> $GITHUB_OUTPUT

          else
            echo "ORG=QA" >> $GITHUB_OUTPUT
          fi

      #####################################
      # ✅ AUTHENTICATE
      #####################################
      - name: Authenticate to Target Org
        env:
          QA_URL: ${{ secrets.SFDX_AUTH_URL_QA }}
          UAT_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
          PROD_URL: ${{ secrets.SFDX_AUTH_URL_PROD }}
        run: |
          if [[ "${{ steps.target.outputs.ORG }}" == "QA" ]]; then
            echo "$QA_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a QA

          elif [[ "${{ steps.target.outputs.ORG }}" == "UAT" ]]; then
            echo "$UAT_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a UAT

          elif [[ "${{ steps.target.outputs.ORG }}" == "PROD" ]]; then
            echo "$PROD_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a PROD
          fi

      #####################################
      # ✅ GENERATE DELTA
      #####################################
      - name: Generate Delta (PR Validation)
        run: |
          mkdir changed-sources
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          sf sgd:source:delta \
            --to "$HEAD" \
            --from "$BASE" \
            --output changed-sources/ \
            --generate-delta \
            --source force-app/

      #####################################
      # ✅ SCANNER
      #####################################
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt install default-jdk -y

      - name: Install SFDX Scanner
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Scan Apex Code (Delta Only)
        run: |
          cd changed-sources
          sf scanner run --format sarif \
            --target "./**/*.cls" \
            --category "Security,Design,BestPractices,Performance" \
            --outfile "apexScanResults.sarif"
          cd ..

      - name: Upload Scanner Results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: changed-sources/apexScanResults.sarif

      #####################################
      # ✅ VALIDATE DEPLOYMENT
      #####################################
      - name: Validate Delta Deployment (Check-only)
        run: |
          if [ -d "changed-sources/force-app" ]; then

            if [ "${{ env.APEX_TEST_LEVEL }}" == "RunSpecifiedTests" ]; then
              echo "✅ Running ONLY specified tests"

              sf project deploy start \
                --source-dir changed-sources/force-app \
                --dry-run \
                --ignore-conflicts \
                --test-level RunSpecifiedTests \
                --tests "${{ env.APEX_TESTS }}" \
                --wait 30 \
                -o ${{ steps.target.outputs.ORG }}

            else
              echo "✅ Running ALL local tests"

              sf project deploy start \
                --source-dir changed-sources/force-app \
                --dry-run \
                --ignore-conflicts \
                --test-level RunLocalTests \
                --wait 30 \
                -o ${{ steps.target.outputs.ORG }}
            fi

          else
            echo "No delta detected → skipping validation."
          fi


  #############################################
  # ✅ DEPLOY TO QA (ON MERGE TO dev)
  #############################################
  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to QA
        env:
          SFDX_AUTH_URL_QA: ${{ secrets.SFDX_AUTH_URL_QA }}
        run: |
          echo "$SFDX_AUTH_URL_QA" > auth.txt
          sf org login sfdx-url -f auth.txt -a QA

      - name: Generate Delta for QA
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" \
            --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy Delta to QA
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o QA
          else
            echo "No delta for QA deployment."
          fi


  #############################################
  # ✅ DEPLOY TO UAT (ON MERGE TO uat)
  #############################################
  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url -f auth.txt -a UAT

      - name: Generate Delta for UAT
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" \
            --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy Delta to UAT
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o UAT
          else
            echo "No delta for UAT deployment."
          fi


