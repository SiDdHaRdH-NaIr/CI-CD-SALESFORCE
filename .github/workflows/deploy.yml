name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches:
      - master
      - dev
      - uat
  push:
    branches:
      - master
      - dev
      - uat

jobs:

  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ Read Apex Tests from PR Description
      - name: Read Apex Tests From PR Description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > pr_body.txt
          TESTS=$(sed -n 's/.*Apex::\[\(.*\)\]::Apex.*/\1/p' pr_body.txt)

          if [ -z "$TESTS" ]; then
            echo "No explicit tests found in PR."
            echo "APEX_TESTS=auto" >> $GITHUB_ENV
          else
            echo "Tests Found: $TESTS"
            echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV
            echo "APEX_TEST_LEVEL=RunSpecifiedTests" >> $GITHUB_ENV
          fi

      # Install Salesforce CLI (sf)
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # Install sfdx-git-delta
      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins

      - name: Select Validation Target
        id: target
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "ORG=QA" >> $GITHUB_OUTPUT
          else
            echo "ORG=UAT" >> $GITHUB_OUTPUT
          fi

      # Authenticate
      - name: Authenticate to Target Org
        env:
          QA_URL: ${{ secrets.SFDX_AUTH_URL_QA }}
          UAT_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          if [[ "${{ steps.target.outputs.ORG }}" == "QA" ]]; then
            echo "$QA_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a QA
          else
            echo "$UAT_URL" > auth.txt
            sf org login sfdx-url -f auth.txt -a UAT
          fi

      # Create delta (base vs head)
      - name: Generate Delta (PR Validation)
        run: |
          mkdir changed-sources
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          sf sgd:source:delta --to "$HEAD" --from "$BASE" --output changed-sources/ --generate-delta --source force-app/

      # ✅ Auto-detect Tests If Not Provided
      - name: Auto Detect Related Tests (If Not Provided)
        if: env.APEX_TESTS == 'auto'
        run: |
          echo "Auto-detecting test classes..."

          TEST_CLASSES=$(find changed-sources -name "*Test.cls" \
            | sed 's#.*/##' \
            | sed 's/\.cls//g' \
            | tr '\n' ',' | sed 's/,$//')

          if [ -z "$TEST_CLASSES" ]; then
            echo "No test classes detected in delta. Using RunLocalTests."
            echo "APEX_TEST_LEVEL=RunLocalTests" >> $GITHUB_ENV
          else
            echo "Detected Tests: $TEST_CLASSES"
            echo "APEX_TEST_LEVEL=RunSpecifiedTests" >> $GITHUB_ENV
            echo "APEX_TESTS=$TEST_CLASSES" >> $GITHUB_ENV
          fi

      # ✅ ✅ ✅ SCANNER JOB ADDED HERE
      - name: Install Java (For Scanner)
        run: |
          sudo apt-get update
          sudo apt install default-jdk -y

      - name: Install SFDX Scanner Plugin
        run: |
          sf plugins install @salesforce/sfdx-scanner

      - name: Scan Apex Code (Delta Only)
        run: |
          cd changed-sources
          sf scanner run --format sarif \
            --target "./**/*.cls" \
            --category "Security,Design,BestPractices,Performance" \
            --outfile "apexScanResults.sarif"
          cd ..

      - name: Upload Scanner Results to GitHub
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: changed-sources/apexScanResults.sarif

      # ✅ Validate with Dynamic Test Selection
      - name: Validate Delta Deployment (Check-only)
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --dry-run \
              --ignore-conflicts \
              --test-level ${{ env.APEX_TEST_LEVEL || 'RunSpecifiedTests' }} \
              --tests "${{ env.APEX_TESTS }}" \
              --wait 30 \
              -o ${{ steps.target.outputs.ORG }}
          else
            echo "No delta detected → skipping validation."
          fi


  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to QA
        env:
          SFDX_AUTH_URL_QA: ${{ secrets.SFDX_AUTH_URL_QA }}
        run: |
          echo "$SFDX_AUTH_URL_QA" > auth.txt
          sf org login sfdx-url -f auth.txt -a QA

      - name: Generate Delta for QA
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy Delta to QA
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o QA
          else
            echo "No delta for QA deployment."
          fi


  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to UAT
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_UAT }}
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url -f auth.txt -a UAT

      - name: Generate Delta for UAT
        run: |
          mkdir changed-sources
          sf sgd:source:delta --to "HEAD" --from "HEAD^" --output changed-sources/ --generate-delta --source force-app/

      - name: Deploy Delta to UAT
        run: |
          if [ -d "changed-sources/force-app" ]; then
            sf project deploy start \
              --source-dir changed-sources/force-app \
              --ignore-conflicts \
              --test-level RunLocalTests \
              --wait 30 \
              -o UAT
          else
            echo "No delta for UAT deployment."
          fi
